<!doctype html>
<meta charset="utf-8">
<!-- (넓은 화면용: 카드 두 장을 가로로. 모바일용은 money.html) '돈 얘기' 구역 이미지. 카드1(파랑): 쓰던 기기 + 토스프론트 = 0원, 없는 비용, 인터넷 안 가입해도 됨 / 카드2(잉크): 포스기 세트 월 34,000원.
     대체하는 글: Q&A 네 개(정말 0원인가요 / 돈이 드는 경우 / 인터넷 가입 / 어떤 기기) 문단들.
     alt: "쓰던 기기와 토스프론트로 시작하면 설치비·관리비·기기값 0원이고, 월 이용료·보증금·가입비가 없으며 인터넷을 새로 가입하지 않아도 됩니다. 태블릿·휴대폰 모두 가능합니다. 포스기 세트는 월 34,000원에 인터넷·CCTV·포스기 본체가 포함됩니다." -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="_base.css">
<style>
#cv{width:700px;display:flex;gap:12px;align-items:stretch}
.card{border-radius:24px;padding:20px 20px 20px}
.card{flex:1 1 0;min-width:0}
.c1{background:var(--blue);color:#fff}
.c2{background:var(--ink);color:#fff}

.pill{display:inline-block;height:32px;line-height:32px;padding:0 15px;border-radius:999px;background:#fff;font-size:15px;font-weight:800;letter-spacing:-.03em;white-space:nowrap}
.c1 .pill{color:var(--blue)}
.c2 .pill{color:var(--ink)}

/* 카드1 */
.zero{display:flex;align-items:center;justify-content:space-between;margin-top:12px;line-height:1}
.zero .n{display:flex;align-items:baseline}
.zero b{font-size:112px;font-weight:900;letter-spacing:-.06em;line-height:.9}
.zero i{font-style:normal;font-size:60px;font-weight:900;letter-spacing:-.05em;margin-left:2px}
.ok{flex:none;width:84px;height:84px;border-radius:26px;background:var(--soft);display:grid;place-items:center}
.what{margin-top:6px;font-size:18px;font-weight:800;letter-spacing:-.035em;white-space:nowrap}

.list{margin-top:20px;display:grid;gap:10px}
.row{display:flex;align-items:center;gap:11px;font-size:17px;font-weight:800;letter-spacing:-.035em;line-height:1.2;white-space:nowrap}
.ck{flex:none;width:30px;height:30px;border-radius:10px;background:var(--soft);display:grid;place-items:center}

.strip{margin-top:20px;border-radius:18px;background:#fff;color:var(--ink);padding:10px 14px 10px 10px;display:flex;align-items:center;gap:12px}
.strip .ic{flex:none;width:56px;height:56px;border-radius:16px;background:var(--soft);display:grid;place-items:center}
.strip b{display:block;font-size:17px;font-weight:900;letter-spacing:-.04em;line-height:1.2}
.strip span{display:block;margin-top:3px;font-size:13px;font-weight:700;letter-spacing:-.02em;color:var(--ink-2);line-height:1.2}

/* 카드2 */
.price{display:flex;align-items:center;justify-content:space-between;margin-top:12px}
.price .p{display:flex;align-items:baseline;color:var(--orange);line-height:1}
.price .p u{text-decoration:none;font-size:22px;font-weight:900;letter-spacing:-.04em;margin-right:6px}
.price .p b{font-size:48px;font-weight:900;letter-spacing:-.06em}
.price .p i{font-style:normal;font-size:26px;font-weight:900;letter-spacing:-.04em;margin-left:3px}
.tile{flex:none;width:60px;height:60px;border-radius:18px;background:var(--soft);display:grid;place-items:center}
.c2 .list{margin-top:16px}
.c2 .row{font-size:16px}
.c2{display:flex;flex-direction:column}.c2 .pill{align-self:flex-start}.c2 .price{margin:auto 0}.c2 .price .p b{font-size:50px}.c2 .price .p u{font-size:24px}.c2 .price .p i{font-size:28px}.c2 .list{margin-top:0;padding-top:0}
</style>
<meta name="gfx-scale" content="2">
<div id="cv" class="bg-white">

  <div class="card c1">
    <span class="pill">쓰던 기기 + 토스프론트</span>
    <div class="zero"><div class="n"><b>0</b><i>원</i></div>
      <div class="ok"><svg width="52" height="52" viewBox="0 0 52 52" fill="none" stroke-linecap="round" stroke-linejoin="round"><circle cx="26" cy="26" r="24" fill="#FF681C"/><path d="M15 27l8 8 14-16" stroke="#fff" stroke-width="5"/></svg></div>
    </div>
    <div class="what">설치비 · 관리비 · 기기값</div>

    <div class="list">
      <div class="row"><span class="ck"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5l4 4L15 4.5" stroke="#2E48FF" stroke-width="3"/></svg></span>월 이용료 없음</div>
      <div class="row"><span class="ck"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5l4 4L15 4.5" stroke="#2E48FF" stroke-width="3"/></svg></span>보증금 없음</div>
      <div class="row"><span class="ck"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5l4 4L15 4.5" stroke="#2E48FF" stroke-width="3"/></svg></span>가입비 없음</div>
      <div class="row"><span class="ck"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5l4 4L15 4.5" stroke="#2E48FF" stroke-width="3"/></svg></span>인터넷 새로 가입 안 해도 됨</div>
    </div>

    <div class="strip">
      <div class="ic">
        <svg width="40" height="38" viewBox="0 0 40 38" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <rect x="1.5" y="2.5" width="27" height="21" rx="4" fill="#fff" stroke="#0B0D12" stroke-width="3"/>
          <rect x="21.5" y="13.5" width="16" height="22" rx="4" fill="#fff" stroke="#2E48FF" stroke-width="3"/>
          <path d="M26.5 30.5h6" stroke="#2E48FF" stroke-width="3"/>
        </svg>
      </div>
      <div><b>태블릿·휴대폰 모두 가능</b><span>기종은 상담에서 확인</span></div>
    </div>
  </div>

  <div class="card c2">
    <span class="pill">포스기 세트</span>
    <div class="price">
      <div class="p"><u>월</u><b>34,000</b><i>원</i></div>
      <div class="tile">
        <svg width="34" height="42" viewBox="0 0 34 42" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <rect x="4.5" y="1.5" width="25" height="28" rx="6" fill="#fff" stroke="#0B0D12" stroke-width="3"/>
          <circle cx="17" cy="14.5" r="6.5" fill="#FF681C"/>
          <path d="M13.8 14.6l2.2 2.2 4.2-4.4" stroke="#fff" stroke-width="2.4"/>
          <path d="M13 29.5v6M21 29.5v6M7 40h20" stroke="#0B0D12" stroke-width="3"/>
        </svg>
      </div>
    </div>
    <div class="list">
      <div class="row"><span class="ck"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5l4 4L15 4.5" stroke="#2E48FF" stroke-width="3"/></svg></span>인터넷·CCTV·포스기 본체 포함</div>
      <div class="row"><span class="ck"><svg width="18" height="18" viewBox="0 0 18 18" fill="none" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5l4 4L15 4.5" stroke="#2E48FF" stroke-width="3"/></svg></span>신규·기존 이용자 모두 가능</div>
    </div>
  </div>

</div>
