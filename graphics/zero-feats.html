<!doctype html>
<meta charset="utf-8">
<meta name="gfx-scale" content="3">
<!-- 파란 카드 '토스프론트가 하는 일'의 체크 목록 7줄을 대체. 설계 폭 300px, 실표시 287px(0.96).
     alt: "토스프론트가 하는 일: 실시간 주문 표시, 결제 금액 안내, 간편결제, 키오스크 기능, 포인트 적립·사용, 브랜드 로고·홍보 이미지 설정, 포스와 자동 연동" -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="_base.css">
<style>
#cv{width:300px;padding:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.f{display:flex;align-items:center;gap:8px;min-height:64px;padding:10px 8px 10px 11px;border-radius:20px;background:rgba(255,255,255,.14)}
.f svg{flex:none}
.f span{opacity:.999;font-size:14px;font-weight:800;letter-spacing:-.035em;line-height:1.28;color:#fff}
</style>
<div id="cv" class="bg-blue">
  <div class="grid">

    <!-- 실시간 주문 표시: 화면 + 주문 줄 + 실시간 점 -->
    <div class="f">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="4" width="34" height="24" rx="5" stroke="#fff" stroke-width="3"/>
        <path d="M10 13h10M10 20h7" stroke="#fff" stroke-width="3"/>
        <circle cx="29" cy="14" r="3.6" fill="#fff"/>
        <path d="M20 28v7M13 36h14" stroke="#fff" stroke-width="3"/>
      </svg>
      <span>실시간<br>주문 표시</span>
    </div>

    <!-- 결제 금액 안내: 영수증 + 합계 칸 -->
    <div class="f">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M9 3h22v34l-5.5-3.5L20 37l-5.5-3.5L9 37z" stroke="#fff" stroke-width="3"/>
        <path d="M15 10.5h10" stroke="#fff" stroke-width="3"/>
        <rect x="15" y="16" width="10" height="7" rx="2" fill="#fff"/>
        <path d="M15 28h5" stroke="#fff" stroke-width="3"/>
      </svg>
      <span>결제<br>금액 안내</span>
    </div>

    <!-- 간편결제: 휴대폰 + 결제 완료 체크 -->
    <div class="f">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="8" y="2" width="24" height="36" rx="6.5" stroke="#fff" stroke-width="3"/>
        <circle cx="20" cy="16.5" r="7" fill="#fff"/>
        <path d="M16.5 16.5l2.7 2.7 4.5-5" stroke="#2E48FF" stroke-width="2.6"/>
        <path d="M16 31h8" stroke="#fff" stroke-width="3"/>
      </svg>
      <span>간편결제</span>
    </div>

    <!-- 키오스크 기능: 화면 + 터치 점 + 받침대 -->
    <div class="f">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="6" y="3" width="28" height="24" rx="5" stroke="#fff" stroke-width="3"/>
        <circle cx="20" cy="15" r="4.6" fill="#fff"/>
        <path d="M20 27v7M11 36.5h18" stroke="#fff" stroke-width="3"/>
      </svg>
      <span>키오스크<br>기능</span>
    </div>

    <!-- 포인트 적립·사용: 동전 + 별 -->
    <div class="f">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="20" cy="20" r="16.5" stroke="#fff" stroke-width="3"/>
        <path d="M20 12.5L22.12 17.59L27.61 18.03L23.42 21.61L24.7 26.97L20 24.1L15.3 26.97L16.58 21.61L12.39 18.03L17.88 17.59Z" fill="#fff" stroke="#fff" stroke-width="2"/>
      </svg>
      <span>포인트<br>적립·사용</span>
    </div>

    <!-- 브랜드 로고·홍보: 이미지 액자 + 해 + 산 -->
    <div class="f">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <rect x="3" y="5" width="34" height="30" rx="6" stroke="#fff" stroke-width="3"/>
        <circle cx="14" cy="14.5" r="3.6" fill="#fff"/>
        <path d="M6 30l8-8 6 6 5-5 9 8" stroke="#fff" stroke-width="3"/>
      </svg>
      <span>브랜드<br>로고·홍보</span>
    </div>

    <!-- 포스 자동 연동: 맞물려 도는 화살표 + 가운데 점 -->
    <div class="f">
      <svg width="40" height="40" viewBox="0 0 40 40" fill="none" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7.2 17.7A13 13 0 0 1 31.3 13.5" stroke="#fff" stroke-width="3"/>
        <path d="M31.3 5v8.5h-8.5" stroke="#fff" stroke-width="3"/>
        <path d="M32.8 22.3A13 13 0 0 1 8.7 26.5" stroke="#fff" stroke-width="3"/>
        <path d="M8.7 35v-8.5h8.5" stroke="#fff" stroke-width="3"/>
        <circle cx="20" cy="20" r="4" fill="#fff"/>
      </svg>
      <span>포스<br>자동 연동</span>
    </div>

  </div>
</div>
