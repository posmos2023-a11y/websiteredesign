<!doctype html>
<meta charset="utf-8">
<meta name="gfx-scale" content="1">
<meta name="gfx-quality" content="82">
<!-- 히어로 사진 합성(1200x675). 태블릿 포스(1) / 토스프론트(2) 번호 라벨.
     대체하는 글: 히어로 사진 설명 캡션. 사진은 보정하지 않는다.
     alt: "카운터 위에 나란히 놓인 태블릿 포스(1)와 토스프론트 카드 단말기(2)" -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="_base.css">
<style>
#cv{width:1200px;height:675px;background:#fff}
#cv img{position:absolute;left:0;top:0;width:1200px;height:675px;display:block}
.pill{position:absolute;display:flex;align-items:center;gap:12px;height:58px;padding:0 26px 0 9px;border-radius:29px;background:#fff;
  box-shadow:0 2px 10px rgba(11,13,18,.22);transform:translateX(-50%);white-space:nowrap}
.pill .n{width:40px;height:40px;border-radius:50%;background:var(--orange);color:var(--ink);display:grid;place-items:center;font-size:25px;font-weight:900;line-height:1;letter-spacing:0}
.pill .t{font-size:29px;font-weight:800;letter-spacing:-.035em;line-height:1;color:var(--ink)}
#p1{left:345px;top:552px}
#p2{left:828px;top:552px}
</style>
<div id="cv">
  <img src="../img/hero-offer-1200.jpg" alt="">
  <div class="pill" id="p1"><span class="n">1</span><span class="t">태블릿 포스</span></div>
  <div class="pill" id="p2"><span class="n">2</span><span class="t">토스프론트</span></div>
</div>
