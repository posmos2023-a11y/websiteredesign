<!doctype html>
<meta charset="utf-8">
<meta name="gfx-scale" content="4">
<!-- 포스기 세트 카드(검은 카드 배경 #0B0D12). 세트에 드는 큰 구성 4가지(인터넷 500M, CCTV, 포스기, 토스프론트)를 2x2 타일로.
     '함께 무상 제공' 4종은 포스기 세트 구역 이미지(set-incl)에만 둔다.
     alt: "인터넷 500M, CCTV, 포스기, 토스프론트" -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="_base.css">
<style>
#cv{width:300px;padding:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.t{height:118px;border-radius:24px;background:rgba(255,255,255,.09);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:12px}
.t .ic{height:56px;display:grid;place-items:center}
.t b{font-size:17px;font-weight:900;letter-spacing:-.04em;color:#fff;line-height:1;white-space:nowrap}
</style>
<div id="cv" class="bg-ink">
  <div class="grid">
    <div class="t"><div class="ic"><svg width="50" height="43" viewBox="0 0 40 34" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12.5a24 24 0 0 1 34 0" stroke="#fff" stroke-width="3"/>
          <path d="M9.5 19.5a15 15 0 0 1 21 0" stroke="#fff" stroke-width="3"/>
          <circle cx="20" cy="28" r="4" fill="#FF681C"/>
        </svg></div><b>인터넷 500M</b></div>
    <div class="t"><div class="ic"><svg width="53" height="48" viewBox="0 0 42 38" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 4v30" stroke="#fff" stroke-width="3"/>
          <path d="M3 19h8" stroke="#fff" stroke-width="3"/>
          <rect x="11" y="9" width="28" height="20" rx="6" stroke="#fff" stroke-width="3"/>
          <circle cx="28" cy="19" r="4.5" fill="#FF681C"/>
        </svg></div><b>CCTV</b></div>
    <div class="t"><div class="ic"><svg width="53" height="50" viewBox="0 0 42 40" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="36" height="25" rx="6" stroke="#fff" stroke-width="3"/>
          <path d="M10 12h14" stroke="#fff" stroke-width="3" opacity=".45"/>
          <path d="M10 20h22" stroke="#FF681C" stroke-width="3"/>
          <path d="M21 28v6M12 37h18" stroke="#fff" stroke-width="3"/>
        </svg></div><b>포스기</b></div>
    <div class="t"><div class="ic"><svg width="48" height="58" viewBox="0 0 50 60" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="32" height="40" rx="7" stroke="#fff" stroke-width="3.6"/>
          <circle cx="25" cy="19" r="8.5" fill="#FF681C"/>
          <path d="M21.5 19l2.6 2.6 4.6-5" stroke="#fff" stroke-width="2.8"/>
          <path d="M20 42v7M30 42v7M12 55h26" stroke="#fff" stroke-width="3.6"/>
        </svg></div><b>토스프론트</b></div>
  </div>
</div>
