<!doctype html>
<meta charset="utf-8">
<meta name="gfx-scale" content="4">
<!-- 포스기 세트 카드(검은 카드 배경 #0B0D12). 큰 타일 4개 + 함께 무상 제공 작은 아이콘 4개.
     대체하는 글: '이런 사장님께' 체크 3줄, '받는 것' 문단.
     alt: "인터넷 500M, CCTV, 포스기 본체, 토스프론트를 드리고, 영수증프린터·금전함·키보드·마우스도 함께 무상으로 드립니다." -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="_base.css">
<style>
#cv{width:300px;padding:0}
.row{display:flex;justify-content:space-between;align-items:flex-start}
.it{width:64px;text-align:center}
.tile{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;background:rgba(255,255,255,.09)}
.lb{margin-top:9px;font-size:15px;font-weight:800;letter-spacing:-.04em;line-height:1.25;color:#fff;white-space:nowrap}
.free{margin-top:16px;border-radius:24px;background:rgba(255,255,255,.09);padding:15px 14px 14px}
.fh{display:flex;align-items:center;justify-content:center;gap:7px;font-size:16px;font-weight:900;letter-spacing:-.04em;color:var(--orange);line-height:1}
.fr{display:flex;justify-content:space-between;align-items:flex-start;margin-top:15px}
.si{width:62px;text-align:center}
.si .ic{height:36px;display:grid;place-items:center}
.sl{margin-top:8px;font-size:13px;font-weight:700;letter-spacing:-.03em;line-height:1.25;color:#fff;white-space:nowrap}
</style>
<div id="cv" class="bg-ink">
  <div class="row">
    <!-- 인터넷 500M -->
    <div class="it">
      <div class="tile">
        <svg width="40" height="34" viewBox="0 0 40 34" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 12.5a24 24 0 0 1 34 0" stroke="#fff" stroke-width="3"/>
          <path d="M9.5 19.5a15 15 0 0 1 21 0" stroke="#fff" stroke-width="3"/>
          <circle cx="20" cy="28" r="4" fill="#FF681C"/>
        </svg>
      </div>
      <div class="lb">인터넷<br>500M</div>
    </div>
    <!-- CCTV -->
    <div class="it">
      <div class="tile">
        <svg width="42" height="38" viewBox="0 0 42 38" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <path d="M3 4v30" stroke="#fff" stroke-width="3"/>
          <path d="M3 19h8" stroke="#fff" stroke-width="3"/>
          <rect x="11" y="9" width="28" height="20" rx="6" stroke="#fff" stroke-width="3"/>
          <circle cx="28" cy="19" r="4.5" fill="#FF681C"/>
        </svg>
      </div>
      <div class="lb">CCTV</div>
    </div>
    <!-- 포스기 본체 -->
    <div class="it">
      <div class="tile">
        <svg width="42" height="40" viewBox="0 0 42 40" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <rect x="3" y="3" width="36" height="25" rx="6" stroke="#fff" stroke-width="3"/>
          <path d="M10 12h14" stroke="#fff" stroke-width="3" opacity=".45"/>
          <path d="M10 20h22" stroke="#FF681C" stroke-width="3"/>
          <path d="M21 28v6M12 37h18" stroke="#fff" stroke-width="3"/>
        </svg>
      </div>
      <div class="lb">포스기<br>본체</div>
    </div>
    <!-- 토스프론트 -->
    <div class="it">
      <div class="tile">
        <svg width="38" height="46" viewBox="0 0 50 60" fill="none" stroke-linecap="round" stroke-linejoin="round">
          <rect x="9" y="2" width="32" height="40" rx="7" stroke="#fff" stroke-width="3.6"/>
          <circle cx="25" cy="19" r="8.5" fill="#FF681C"/>
          <path d="M21.5 19l2.6 2.6 4.6-5" stroke="#fff" stroke-width="2.8"/>
          <path d="M20 42v7M30 42v7M12 55h26" stroke="#fff" stroke-width="3.6"/>
        </svg>
      </div>
      <div class="lb">토스<br>프론트</div>
    </div>
  </div>

  <div class="free">
    <div class="fh">
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" stroke-linecap="round"><path d="M8 2v12M2 8h12" stroke="#FF681C" stroke-width="3.4"/></svg>
      <span>함께 무상 제공</span>
    </div>
    <div class="fr">
      <!-- 영수증프린터 -->
      <div class="si">
        <div class="ic">
          <svg width="36" height="34" viewBox="0 0 36 34" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <path d="M10 14V4h16v10" stroke="#fff" stroke-width="3"/>
            <rect x="3" y="14" width="30" height="14" rx="5" stroke="#fff" stroke-width="3"/>
            <path d="M11 22h14" stroke="#FF681C" stroke-width="3"/>
          </svg>
        </div>
        <div class="sl">영수증<br>프린터</div>
      </div>
      <!-- 금전함 -->
      <div class="si">
        <div class="ic">
          <svg width="36" height="34" viewBox="0 0 36 34" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <rect x="5" y="2" width="26" height="17" rx="4" stroke="#fff" stroke-width="3"/>
            <circle cx="18" cy="9.5" r="3.4" fill="#FF681C"/>
            <rect x="2" y="16" width="32" height="16" rx="5" fill="#212227" stroke="#fff" stroke-width="3"/>
            <path d="M14 24h8" stroke="#FF681C" stroke-width="3"/>
          </svg>
        </div>
        <div class="sl">금전함</div>
      </div>
      <!-- 키보드 -->
      <div class="si">
        <div class="ic">
          <svg width="36" height="30" viewBox="0 0 36 30" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="30" height="24" rx="6" stroke="#fff" stroke-width="3"/>
            <path d="M10 11h.01M18 11h.01M26 11h.01" stroke="#fff" stroke-width="3.6"/>
            <path d="M11 19h14" stroke="#FF681C" stroke-width="3"/>
          </svg>
        </div>
        <div class="sl">키보드</div>
      </div>
      <!-- 마우스 -->
      <div class="si">
        <div class="ic">
          <svg width="26" height="36" viewBox="0 0 26 36" fill="none" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="3" width="20" height="30" rx="10" stroke="#fff" stroke-width="3"/>
            <path d="M13 3v10" stroke="#fff" stroke-width="3"/>
            <path d="M13 17v5" stroke="#FF681C" stroke-width="3.4"/>
          </svg>
        </div>
        <div class="sl">마우스</div>
      </div>
    </div>
  </div>
</div>
