<!doctype html>
<meta charset="utf-8">
<!-- 검은 패널(월 34,000원에 들어 있는 것) - 모바일용. 설계 폭 300px, 2열 x 4행 + 하단 '함께 무상 제공' 줄.
     대체하는 글: 체크 목록 8줄 + '함께 무상 제공' 문단.
     alt: "월 34,000원에 들어 있는 것: 인터넷 500M + WiFi + AI전화, CCTV + 월 2회 무료 출동, 최신형 포스기 본체, 토스프론트 카드단말기, 배달 3사 통합프로그램, 회원관리 프로그램, 카드사 가맹 대행, A/S + 고객센터. 영수증프린터·금전함·키보드·마우스도 함께 무상 제공." -->
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="_base.css">
<style>
#cv{width:300px;padding:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.cell{background:rgba(255,255,255,.09);border-radius:20px;padding:14px 6px 13px;display:flex;flex-direction:column;align-items:center;text-align:center}
.cell svg{width:50px;height:50px}
.cell b{display:block;margin-top:8px;font-size:14px;font-weight:800;letter-spacing:-.03em;line-height:1.25;color:#fff}
.free{display:flex;align-items:center;gap:10px;margin:20px 4px 10px;font-size:15px;font-weight:900;letter-spacing:-.03em;color:var(--orange)}
.free::after{content:"";flex:1;height:2px;border-radius:2px;background:rgba(255,255,255,.16)}
.chips{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.chip{display:flex;align-items:center;gap:7px;height:46px;padding:0 9px;border-radius:16px;background:rgba(255,255,255,.09);font-size:14px;font-weight:800;letter-spacing:-.03em;color:#fff;white-space:nowrap}
.chip svg{width:26px;height:26px;flex:none}
</style>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <!-- 인터넷 + WiFi -->
    <g id="i-wifi">
      <path d="M4.2 17.2A28 28 0 0 1 43.8 17.2"/>
      <path d="M10.6 23.6A19 19 0 0 1 37.4 23.6"/>
      <path d="M16.9 29.9A10 10 0 0 1 31.1 29.9"/>
      <circle cx="24" cy="38" r="3.6" fill="#FF681C" stroke="none"/>
    </g>
    <!-- CCTV 카메라 -->
    <g id="i-cctv">
      <g transform="rotate(14 24 17.5)">
        <rect x="8" y="9" width="32" height="17" rx="5"/>
        <circle cx="31" cy="17.5" r="4.6" fill="#FF681C" stroke="none"/>
      </g>
      <path d="M15 24.5v13.5M7 41h16"/>
    </g>
    <!-- 포스기 본체 -->
    <g id="i-pos">
      <rect x="5" y="6" width="38" height="27" rx="5"/>
      <path d="M24 33v7M14 42h20"/>
      <path d="M13 15h11M13 23h7"/>
      <rect x="29" y="14" width="8" height="10" rx="2" fill="#FF681C" stroke="none"/>
    </g>
    <!-- 카드 단말기 -->
    <g id="i-term">
      <path d="M17 14V6a3 3 0 0 1 3-3h8a3 3 0 0 1 3 3v8" stroke="#FF681C"/>
      <path d="M17 8.5h14" stroke="#FF681C"/>
      <rect x="11" y="14" width="26" height="31" rx="6"/>
      <rect x="16.5" y="19.5" width="15" height="8.5" rx="2.5"/>
      <g fill="#fff" stroke="none">
        <circle cx="18" cy="34.5" r="1.9"/><circle cx="24" cy="34.5" r="1.9"/><circle cx="30" cy="34.5" r="1.9"/>
        <circle cx="18" cy="40" r="1.9"/><circle cx="24" cy="40" r="1.9"/><circle cx="30" cy="40" r="1.9"/>
      </g>
    </g>
    <!-- 배달 오토바이 -->
    <g id="i-bike">
      <circle cx="11" cy="37" r="5.5"/>
      <circle cx="37" cy="37" r="5.5"/>
      <rect x="4" y="8" width="17" height="14" rx="3" fill="#FF681C" stroke="none"/>
      <path d="M11 31.5V27M6 27H22L26 36H31"/>
      <path d="M37 31.5L33 13H39"/>
    </g>
    <!-- 회원 카드 -->
    <g id="i-member">
      <rect x="4" y="9" width="40" height="30" rx="6"/>
      <circle cx="16" cy="21.5" r="4.6" fill="#FF681C" stroke="none"/>
      <path d="M9.5 33.5a6.5 6.5 0 0 1 13 0"/>
      <path d="M29 20h9M29 27h6"/>
    </g>
    <!-- 서류 + 가맹 승인 -->
    <g id="i-doc">
      <path d="M11 4h15l10 10v26a3 3 0 0 1-3 3H11a3 3 0 0 1-3-3V7a3 3 0 0 1 3-3z"/>
      <path d="M26 4v10h10"/>
      <path d="M14 23h12M14 30h7"/>
      <circle cx="34" cy="37" r="8.5" fill="#FF681C" stroke="none"/>
      <path d="M30.2 37l2.8 2.8 4.8-5.2" stroke="#fff" stroke-width="2.8"/>
    </g>
    <!-- 헤드셋 -->
    <g id="i-headset" transform="translate(0 -3)">
      <path d="M8 28v-4a16 16 0 0 1 32 0v4"/>
      <rect x="5" y="27" width="8" height="13" rx="3.5"/>
      <rect x="35" y="27" width="8" height="13" rx="3.5"/>
      <path d="M39 40v1a5 5 0 0 1-5 5h-5"/>
      <rect x="22" y="43.5" width="9" height="5" rx="2.5" fill="#FF681C" stroke="none"/>
    </g>
    <!-- 하단: 영수증프린터 / 금전함 / 키보드 / 마우스 (28 기준) -->
    <g id="s-printer">
      <path d="M8 13V5a1 1 0 0 1 1-1h10a1 1 0 0 1 1 1v8"/>
      <rect x="3" y="13" width="22" height="11" rx="3.5"/>
      <circle cx="20" cy="18.5" r="1.9" fill="#FF681C" stroke="none"/>
    </g>
    <g id="s-drawer">
      <rect x="8" y="3.5" width="12" height="7" rx="1.5" stroke="#FF681C"/>
      <rect x="3" y="12" width="22" height="13" rx="3.5"/>
      <path d="M11 18.5h6"/>
    </g>
    <g id="s-keyboard">
      <rect x="2.5" y="4.5" width="23" height="19" rx="4"/>
      <path d="M8 10h.01M12.7 10h.01M17.3 10h.01M22 10h.01M8 14.5h.01M12.7 14.5h.01M17.3 14.5h.01M22 14.5h.01"/>
      <path d="M9.5 19.3h9" stroke="#FF681C"/>
    </g>
    <g id="s-mouse">
      <rect x="7" y="3" width="14" height="22" rx="7"/>
      <path d="M14 3v8M7 11h14"/>
      <path d="M14 6.5v1.5" stroke="#FF681C"/>
    </g>
  </defs>
</svg>
<div id="cv" class="bg-ink">
  <div class="grid">
    <div class="cell"><svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><use href="#i-wifi"/></svg><b>인터넷 500M<br>+ AI전화</b></div>
    <div class="cell"><svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><use href="#i-cctv"/></svg><b>CCTV + 월 2회<br>무료 출동</b></div>
    <div class="cell"><svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><use href="#i-pos"/></svg><b>포스기 본체</b></div>
    <div class="cell"><svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><use href="#i-term"/></svg><b>토스프론트</b></div>
    <div class="cell"><svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><use href="#i-bike"/></svg><b>배달 3사 통합</b></div>
    <div class="cell"><svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><use href="#i-member"/></svg><b>회원관리</b></div>
    <div class="cell"><svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><use href="#i-doc"/></svg><b>카드사 가맹<br>대행</b></div>
    <div class="cell"><svg viewBox="0 0 48 48" fill="none" stroke="#fff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><use href="#i-headset"/></svg><b>A/S·고객센터</b></div>
  </div>
  <div class="free">함께 무상 제공</div>
  <div class="chips">
    <div class="chip"><svg viewBox="0 0 28 28" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><use href="#s-printer"/></svg>영수증프린터</div>
    <div class="chip"><svg viewBox="0 0 28 28" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><use href="#s-drawer"/></svg>금전함</div>
    <div class="chip"><svg viewBox="0 0 28 28" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><use href="#s-keyboard"/></svg>키보드</div>
    <div class="chip"><svg viewBox="0 0 28 28" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><use href="#s-mouse"/></svg>마우스</div>
  </div>
</div>
