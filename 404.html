:root{
  --ink:#0B0D12;--ink-2:#4A5060;--ink-3:#69707F;--line:#E4E7EC;--soft:#F2F4F7;

}
@media (min-width:700px){ :root{ --g:32px; --top:84px; } }
@media (min-width:1200px){ :root{ --g:48px; } }

*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%;overflow-x:clip}
body{
  font-family:"Pretendard Variable","Pretendard",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  color:var(--ink);background:#fff;line-height:1.5;font-size:17px;
  -webkit-font-smoothing:antialiased;overflow-x:hidden;overflow-x:clip;word-break:keep-all;overflow-wrap:break-word;
  min-height:100vh;display:flex;flex-direction:column;
}
img{display:block;max-width:100%;height:auto}
a{color:inherit;text-decoration:none}
:focus-visible{outline:3px solid var(--blue);outline-offset:3px}
.wrap{width:100%;max-width:calc(var(--max) + var(--g) * 2);margin:0 auto;padding:0 max(var(--g),env(safe-area-inset-right)) 0 max(var(--g),env(safe-area-inset-left))}
.skip{position:absolute;left:8px;top:-80px;z-index:60;padding:12px 16px;background:#fff;border-radius:12px;color:var(--blue);font-weight:700}
.skip:focus{top:8px}
.nb{white-space:nowrap}

/* ---------- 버튼 ---------- */
.btn,.btn-o{
  display:inline-flex;align-items:center;justify-content:center;gap:8px;
  min-height:56px;padding:6px 22px;border-radius:16px;border:0;cursor:pointer;
  font-weight:700;font-size:17px;line-height:1.2;letter-spacing:-.01em;text-align:center;white-space:nowrap;
  transition:transform .35s var(--ease), background-color .2s, box-shadow .35s var(--ease);
}
.btn:active,.btn-o:active{transform:scale(.97)}
.btn{background:var(--blue);color:#fff}
.btn-o{background:var(--soft);color:var(--ink)}
@media (hover:hover) and (pointer:fine){ .btn:hover{background:var(--blue-d)} .btn-o:hover{background:#E6E9EF} }

/* ---------- 헤더 ---------- */
.hd{position:sticky;top:0;z-index:50;background:#fff;box-shadow:0 1px 0 rgba(11,13,18,.06)}
.hd .wrap{display:flex;align-items:center;gap:8px;height:60px}
.logo{display:flex;align-items:center;min-height:48px;margin-right:auto}
.logo img{height:24px;width:auto}
.menu{display:none}
.hd-tel{min-height:48px;padding:0 14px;font-size:15px;border-radius:12px;white-space:nowrap}
.hd-tel svg{width:18px;height:18px;flex:none;fill:currentColor}
.hd-tel .p{display:none}
@media (min-width:700px){
  .hd .wrap{height:72px}
  .logo img{height:28px}
  .hd-tel{padding:0 18px}
  .hd-tel .p{display:inline}.hd-tel .m{display:none}
}
@media (min-width:1100px){
  .menu{display:flex;gap:2px;margin-right:14px}
  .menu a{display:flex;align-items:center;min-height:48px;padding:0 13px;font-size:15.5px;font-weight:700;letter-spacing:-.02em;color:var(--ink-2);border-radius:12px;white-space:nowrap;transition:color .2s,background-color .2s}
  .menu a:hover{color:var(--ink);background:var(--soft)}
}

/* ---------- 본문 ---------- */
.nf{flex:1 0 auto;padding:48px 0 72px}
.nf-code{font-size:clamp(96px,22vw,240px);font-weight:900;letter-spacing:-.06em;line-height:.9;color:var(--blue)}
.nf-code i{display:inline-block;width:.2em;height:.2em;margin-left:.04em;border-radius:50%;background:var(--orange)}
.nf h1{margin-top:20px;font-size:clamp(32px,5vw,56px);font-weight:900;letter-spacing:-.045em;line-height:1.18;text-wrap:balance}
.nf-sub{margin-top:14px;font-size:18px;font-weight:600;color:var(--ink-2)}
.nf-cta{display:grid;gap:10px;margin-top:32px;max-width:460px}
.nf-cta .row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.nf-tel{display:inline-flex;align-items:center;min-height:48px;margin-top:14px;font-weight:700;text-decoration:underline;text-decoration-color:var(--orange);text-decoration-thickness:2px;text-underline-offset:5px}
@media (min-width:700px){ .nf{padding:88px 0 120px} .nf-sub{font-size:20px} }

/* ---------- 푸터 ---------- */
.ft{padding:28px 0 calc(36px + env(safe-area-inset-bottom));background:var(--soft);font-size:14px;line-height:1.7;color:var(--ink-2)}
.ft a{display:inline-flex;align-items:center;min-height:48px;color:var(--ink);font-size:15px;font-weight:700;text-decoration:underline;text-decoration-thickness:2px;text-underline-offset:5px}
@media (min-width:900px){ .ft .wrap{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:0 24px} }
